name: ci
on:
  # Branch pushes only: pushing a tag must not rerun CI against an old commit.
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest
      # The editable install above builds an editable wheel, not the real one, so a broken wheel build passed CI. Build it, then run it from a clean environment.
      - name: wheel
        shell: bash
        run: |
          pip install uv
          uv build --wheel --out-dir dist
          uvx --isolated --from dist/timeexisting-*.whl te --help
