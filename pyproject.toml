[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name            = "timeexisting"
version         = "0.1.0"
description     = "A work-time tracker with a dim view of work, time and tracking."
readme          = { file = "README.org", content-type = "text/plain" }
requires-python = ">=3.14"
license         = { text = "MIT" }
dependencies = [
    "rich>=13.7",
    "platformdirs>=4.2",
    "psutil>=5.9",
    "readchar>=4.1",
    "holidays>=0.57",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
windows = ["windows-toasts>=1.1; sys_platform == 'win32'", "pywin32>=306; sys_platform == 'win32'"]
dev     = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6", "pre-commit>=3.7"]

[project.scripts]
te = "timeexisting.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/timeexisting"]

[tool.hatch.build.targets.wheel.force-include]
"src/timeexisting/assets" = "timeexisting/assets"

[tool.ruff]
line-length    = 110
target-version = "py314"
src            = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PTH", "DTZ", "ARG", "C4", "RET"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths      = ["tests"]
addopts        = "-q --strict-markers"
filterwarnings = ["error"]
