repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^src/timeexisting/assets/ascii_art/
      - id: trailing-whitespace
        exclude: ^src/timeexisting/assets/ascii_art/
      - id: check-toml
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: no-control-chars
        name: reject control characters
        language: pygrep
        entry: '[\x00-\x08\x0b\x0c\x0e-\x1f]'
        files: '\.(org|md|py|toml|ya?ml|txt|cfg|ini)$'
