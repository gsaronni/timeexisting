name: ci
on:
  # Branch pushes only: pushing a tag must not rerun CI against an old commit.
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,windows]"
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest
